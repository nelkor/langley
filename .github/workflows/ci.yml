name: CI

on:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build internal dependencies
        run: npm run build:words

      - name: Run tests
        run: npm t

      - name: Run lint
        run: npm run lint

      # DEBUG SECTION
      - name: Debug
        run: |
          cd packages/web
          npx tsc --version
      # END DEBUG SECTION

      - name: Run TypeScript check
        run: npm run ts
